name: Authenticated E2E Once

on:
  push:
    branches:
      - feature/phase-11-client-core

permissions:
  contents: read

jobs:
  client-core:
    if: contains(github.event.head_commit.message, '[e2e-once]')
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NUS_E2E_EMAIL: ${{ secrets.NUS_E2E_EMAIL }}
      NUS_E2E_PASSWORD: ${{ secrets.NUS_E2E_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium

      - name: Run real authenticated Client Core browser flow
        run: npm run test:e2e
