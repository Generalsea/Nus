name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund

      - name: Commit generated lockfile
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: |
          if git status --porcelain -- package-lock.json | grep -q .; then
            git fetch origin "${GITHUB_HEAD_REF}" --depth=1
            git checkout -B "${GITHUB_HEAD_REF}" "origin/${GITHUB_HEAD_REF}"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: commit reproducible npm lockfile"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
