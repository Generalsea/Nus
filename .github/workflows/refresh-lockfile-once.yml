name: Refresh lockfile once

on:
  push:
    branches:
      - feature/phase-11-client-core

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[lock-refresh]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Regenerate package lock without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Validate lockfile consistency
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify lockfile contains no vulnerable braces package
        run: |
          node - <<'NODE'
          const lock = require('./package-lock.json')
          if (Object.hasOwn(lock.packages ?? {}, 'node_modules/braces')) {
            throw new Error('braces remains in the resolved dependency graph')
          }
          if (Object.hasOwn(lock.packages ?? {}, 'node_modules/micromatch')) {
            throw new Error('micromatch remains in the resolved dependency graph')
          }
          if (Object.hasOwn(lock.packages ?? {}, 'node_modules/fast-glob')) {
            throw new Error('fast-glob remains in the resolved dependency graph')
          }
          if (Object.hasOwn(lock.packages ?? {}, 'node_modules/eslint-config-next')) {
            throw new Error('eslint-config-next remains in the resolved dependency graph')
          }
          NODE

      - name: Validate diff
        run: |
          git diff --check
          git diff -- package-lock.json package.json
          git diff --exit-code -- package.json

      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already clean"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "ci: refresh lockfile [lock-refresh]"
          git push origin HEAD:feature/phase-11-client-core
